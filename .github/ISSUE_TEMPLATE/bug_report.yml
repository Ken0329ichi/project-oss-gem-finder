name: Bug Report
description: Create a report to help us improve OSS Gem Finder
title: '[BUG] '
labels: ['bug']
assignees: ['Ken0329ichi']
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: E.g., The scatter plot filter fails when selecting TypeScript...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: E.g., Chrome 120 on macOS / Edge on Windows 11
