name: Feature Request
description: Suggest an idea or new metric for OSS Gem Finder
title: '[FEATURE] '
labels: ['enhancement']
assignees: ['Ken0329ichi']
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What would you like to see added or improved?
      placeholder: E.g., Add a filter for license types or export functionality...
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this feature needed?
      description: Explain the use case or benefit.
